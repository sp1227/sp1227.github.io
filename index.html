<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>sp1227</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --accent-hover: #79c0ff;
      --green: #3fb950;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header .logo {
      font-size: 20px;
      font-weight: 600;
      color: var(--text);
      text-decoration: none;
    }

    main {
      flex: 1;
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
      padding: 48px 24px;
    }

    .profile {
      display: flex;
      gap: 32px;
      align-items: flex-start;
      margin-bottom: 48px;
    }

    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: var(--surface);
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      flex-shrink: 0;
    }

    .profile-info h1 {
      font-size: 28px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
    }

    .profile-info .handle {
      color: var(--muted);
      font-size: 18px;
      margin-bottom: 12px;
    }

    .profile-info .bio {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 16px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--muted);
      margin-right: 16px;
    }

    .badge::before {
      content: attr(data-icon);
    }

    .section {
      margin-bottom: 40px;
    }

    .section-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
      margin-bottom: 16px;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      text-decoration: none;
      display: block;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
    }

    .card-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 6px;
    }

    .card-desc {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.5;
      margin-bottom: 14px;
    }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 12px;
      color: var(--muted);
    }

    .lang-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 4px;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .link-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: border-color 0.2s, color 0.2s;
    }

    .link-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    footer {
      border-top: 1px solid var(--border);
      padding: 20px 24px;
      text-align: center;
      font-size: 13px;
      color: var(--muted);
    }

    @media (max-width: 560px) {
      .profile {
        flex-direction: column;
        gap: 16px;
      }

      .card-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <header>
    <a href="/" class="logo">sp1227</a>
  </header>

  <main>
    <section class="profile">
      <div class="avatar">👤</div>
      <div class="profile-info">
        <h1>sp1227</h1>
        <div class="handle">@sp1227</div>
        <p class="bio">안녕하세요! 개발을 좋아하는 개발자입니다.</p>
        <div>
          <span class="badge" data-icon="📍">Korea</span>
          <span class="badge" data-icon="🔗">
            <a href="https://github.com/sp1227" style="color: inherit; text-decoration: none;">github.com/sp1227</a>
          </span>
        </div>
      </div>
    </section>

    <section class="section">
      <h2 class="section-title">Projects</h2>
      <div class="card-grid">
        <a href="https://github.com/sp1227" class="card">
          <div class="card-title">sp1227.github.io</div>
          <div class="card-desc">개인 GitHub Pages 사이트입니다.</div>
          <div class="card-meta">
            <span><span class="lang-dot" style="background:#f1e05a;"></span>HTML</span>
            <span>⭐ 0</span>
          </div>
        </a>
      </div>
    </section>

    <section class="section">
      <h2 class="section-title">Links</h2>
      <div class="links">
        <a href="https://github.com/sp1227" class="link-btn">
          <svg height="18" viewBox="0 0 16 16" width="18" fill="currentColor">
            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
          </svg>
          GitHub
        </a>
      </div>
    </section>
  </main>

  <footer>
    &copy; 2026 sp1227 &middot; Powered by GitHub Pages
  </footer>

</body>
</html>
